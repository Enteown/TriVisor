<!DOCTYPE html>
<html>
	<head>
		<meta name="description" content="A pocket client-side scrapper, made for tackling a great stress."/>
		<title>Website Loader</title>
		<style>
			div {
				width: 60vw;
				margin: 15vh auto;
			}
			img {
				width: 45px;
			}
			h1 {
				font-size: 1.375em;
			}
			textarea {
				border: 2px solid lightgrey;
				resize: none;
				width: 50vw;
				height: 8vh;
			}
			.hidden {
				visibility: hidden;
			}
		</style>
	</head>
	<body>
		<div class="hidden">
			<img src="../img/dead-page.svg"/>
			<br/>
			<h1>Sorry, we stumbled at the very midway.</h1>
			<p>It happened because, fetching request for the webpage wasn't succeeded. Maybe a check, helps solving the reaching issue?</p>
			<textarea disabled></textarea>
		</div>
		<script>
			// Never underestimate my power!
			"use strict";



			// Here now? Means everything is going as planned.
			// Wanna start the mission we dealt for?

			// Check if a perfect playground is present.
			if (top === window) throw new Error("This page is only supposed to run along with Acode WebView.");


			// Notice: This part is for exposed methods for current page.
			// An implementation of some completely faked descriptors.
			Object.assign(window, {
				"url": new URL(decodeURIComponent(location.search.slice(2))),
				"headers": new Headers({
					"Sec-Ch-Ua-Mobile": "?" + Number(navigator.userAgentData.mobile),
					"Sec-Ch-Ua-Platform": '"' + navigator.userAgentData.platform + '"',
					"User-Agent": navigator.userAgent
				})
			});

			// Mimic a real example.
			navigator.userAgentData.brands.forEach(data => headers.append("Sec-Ch-Ua", '"' + data.brand + '";v="' + data.version + '"'));

			// Really? Yep, really!
			console = top.console; // For, "Eruda"

			// I'm your new, beautiful maid, sir if you need me!
			if (! ("canParse" in URL)) URL.canParse = function canParse(uri, base) {
				try {
					new URL(uri, base);
					return true;
				} catch {
					// The ultimate solution.
					return false;
				};
			};

			// Doppelganger guys, yahh!
			function fetch(init = "", options) {
				if (! (options?.constructor?.name === "Object" || options instanceof Request)) options = {};
				if (! (typeof init === "string" || init instanceof Request)) init = String(init);
				if (typeof init === "string") if (! URL.canParse(init)) init = top.acode.joinUrl(url.origin, init); // Not gonna force, but of course wanna guide you.

				const req = new Request(init, options), base = new URL(req.url), setsrc = (metadata, response) => {
					Object.defineProperty(metadata, "redirected", {
						"value": base.origin + base.pathname === response.url.match(/^([^?#]+)/)[0],
						"enumerable": true,
						"configurable": true
					});
					Object.defineProperty(metadata, "url", {
						"value": response.url,
						"enumerable": true,
						"configurable": true
					});
				};

				return new Promise(async (resolve, reject) => {
					if (req.credentials !== "same-origin" && req.credentials !== "omit" && req.credentials !== "include") return reject(new DOMException("Invalid cookies sender configuration value got, request can't be proceeded.", "FetchError"));
					if (req.method !== "GET" && req.method !== "POST" && req.method !== "PUT" && req.method !== "PATCH" && req.method !== "DELETE" && req.method !== "HEAD" && req.method !== "OPTIONS") return reject(new DOMException("That request type isn't supported, yet.", "FetchError"));
					if (req.redirect !== "follow" && req.redirect !== "manual" && req.redirect !== "error") return reject(new DOMException("Invalid redirection command given, stopped outgoing request.", "FetchError"));
					if (req.signal.aborted) return reject(new DOMException("Signal is already broken, making request to server isn't permitted.", "AbortError"));
					else req.signal.addEventListener("abort", event => {
						// Hey, fr?
						let cancelled = false;
						// "Divine Flame"!
						top.cordova.plugin.http.abort(requestId, signal => (cancelled = signal.aborted), report => {
							top.toast("Error Code: " + report.status);
							console.error(new DOMException(report.error, "AbortError"));
						});
						// Byee, go die.
						if (cancelled) reject(event.target.reason);
					}, {
						"once": true
					});

					const plainHObject = {};
					let data = {}, serializer = "json", requestId;

					req.headers.forEach((value, key) => plainHObject[key] = value);
					headers.forEach((value, key) => plainHObject[key] = value);

					if ((req.credentials === "same-origin" && base.origin !== url.origin) || req.credentials === "omit") plainHObject["Cookie"] = "";
					if (req.body !== null && req.body !== void 0) if (req.body instanceof FormData) {
						data = req.body;
						serializer = "multipart";
					} else if (req.body instanceof ReadableStream) {
						const reader = req.body.getReader(), chunks = [];
						let totalLength = 0;

						while (true) {
							const { done, value } = await reader.read();

							if (done) break;

							// Probably, a little piece:
							chunks.push(value);
							totalLength += value.byteLength;
						};

						// Merging all chunks to a single one:
						const resultBuffer = new Uint8Array(totalLength);
						let offset = 0;

						for (const chunk of chunks) {
							resultBuffer.set(chunk, offset);
							offset += chunk.byteLength;
						};

						data = resultBuffer.buffer;
						serializer = "raw";
					} else if (req.body instanceof Blob || req.body instanceof File) {
						data = await req.body.arrayBuffer();
						serializer = "raw";
						plainHObject["Content-Type"] = req.body.type || "application/octet-stream";
					} else if (req.body instanceof ArrayBuffer) {
						data = req.body;
						serializer = "raw";
					} else if (ArrayBuffer.isView(req.body)) {
						data = req.body.buffer; // Send underneath informations.
						serializer = "raw";
					} else if (req.body instanceof URLSearchParams) {
						const params = {};

						req.body.forEach((value, key) => params[key] = value);

						data = params;
						serializer = "urlencoded";
					} else if (typeof req.body === "string") {
						data = req.body;
						serializer = "utf8";
					} else if (typeof req.body === "object") data = req.body;

					// Wire up the mask:
					requestId = top.cordova.plugin.http.sendRequest(base.origin + base.pathname, {
						"method": req.method.toLowerCase(),
						"data": data,
						"params": Object.fromEntries(base.searchParams),
						"serializer": serializer,
						"responseType": "arraybuffer",
						"timeout": 31536000, // Set global limit, "one year"! Bro, enough for a breakthrough.
						"followRedirect": req.redirect === "follow",
						"headers": plainHObject
					}, response => {
						const algoStrength = {
							// Priority Level:
							"sha-256": 1,
							"sha-384": 2,
							"sha-512": 3
							// Yep, right point. Only those three.
						};
						let hashCalculated, tokens = [], bestToken = null, bestStrength = 0, vfLockSerial;

						// 1. Differentiate parts by whitespaces among them:
						if (req.integrity) tokens = req.integrity.trim().split(/\s+/);

						// 2. Select one from the strongest, most powerful algorithm:
						for (const token of tokens) {
							const cMatch = token.match(/^(sha-256|sha-384|sha-512)-([A-Za-z0-9+/=]+)$/);

							// Format didn't matched? (If unknown.) Skip it, with no time!
							if (! cMatch) continue;

							const algo = cMatch[1];

							// Upgrade if supported till the last one.
							if (algoStrength[algo] > bestStrength) {
								bestStrength = algoStrength[algo];
								bestToken = {
									"algo": algo.toUpperCase(),
									"expectedHash": cMatch[2]
								};
							};
						};

						// Ha ha haa...
						// 3. Dynamically generate hash using built-in, "Web Crypto API":
						if (bestToken) crypto.subtle.digest(bestToken.algo, response.data).then(hashBuffer => hashCalculated = btoa(Array.from(new Uint8Array(hashBuffer)).map(byte => String.fromCharCode(byte)).join(""))); // 4. And right after that, convert it to Base-64 string data. (Removed spreading technique, because it has an drawback with large files.)
						else if (req.integrity) return reject(new TypeError("SRI check failure: invalid attribute value."));

						vfLockSerial = setInterval(() => {
							if (req.integrity) {
								if (! hashCalculated) return; // Hold lock until master key arrives.
								if (hashCalculated !== bestToken.expectedHash) {
									clearInterval(vfLockSerial);
									return reject(new TypeError("SRI check failure: value not matched.")); // 5. Match fingerprint.
								};
							};

							const metadata = new Response(response.data, {
								"headers": new Headers(response.headers),
								"status": response.status,
								"statusText": "OK"
							});

							clearInterval(vfLockSerial);
							setsrc(metadata, response);
							resolve(metadata);
						});
					}, response => {
						if (response.status < 0) {
							// It's an internal software/network error.
							const code = top.cordova.plugin.http.ErrorCode;
							let message;

							switch (response.status) {
								case code.SSL_EXCEPTION:
									message = "SSL handshake failure, invalid certificate, or untrusted host.";
									break;
								case code.SERVER_NOT_FOUND:
									message = "Hostname could not be resolved (DNS failure).";
									break;
								case code.UNSUPPORTED_URL:
									message = "The URL protocol schema is malformed or unsupported.";
									break;
								case code.NOT_CONNECTED:
									message = "The device has no active internet connection.";
									break;
								case code.POST_PROCESSING_FAILED:
									message = "Failed to parse data (e.g., unexpected JSON token formatting).";
									break;
								default:
									message = "An unregistered Cordova (internal) plug-in error occurred.";
									break;
							};

							reject(new DOMException(message, "FetchError"));
						} else {
							const metadata = new Response(null, {
								"headers": new Headers(response.headers),
								"status": response.status,
								"statusText": response.error
							});

							setsrc(metadata, response);
							resolve(metadata);
						};
					});
				});
			};


			// Notice: This part configures the page.
			// Grab the page structure.
			fetch(url.toString()).then(async response => {
				if (! response.ok) {
					top.toast("Error Code: " + response.status);
					throw new Error(response.statusText);
				};

				const txtMTypes = ["javascript", "json", "xml", "wat"], ctHeader = response.headers.get("Content-Type"),

					// Get everything before the semicolon, trimmed.
					mimetype = ctHeader.split(";")[0].trim(),

					// Extract the text encoding using a regular expression.
					charset = ctHeader.match(/charset=([^;]+)/i)?.[1];
				let data, isText = false;

				if ((mimetype.startsWith("text/") || txtMTypes.some(item => mimetype.endsWith(item))) && (isText = true)) data = new TextDecoder(charset).decode(await response.arrayBuffer()); // Safely decode by the correct text encoding.

				// Way to go now!
				return { data, isText, mimetype };
			}).then(async result => {
				const { data, isText, mimetype } = result;

				if (isText) if (mimetype.endsWith("html") || mimetype.endsWith("xml")) {
					const DOMContent = new DOMParser().parseFromString(data, mimetype);
					let base = DOMContent.querySelector("head base");

					if (DOMContent.doctype) document.replaceChild(document.adoptNode(DOMContent.doctype), document.doctype); // Snatch the existing document type declaration.

					// Make relative links working:
					if (base) {
						if (! base.href) base.href = url.origin + "/";
						if (! URL.canParse(base.href)) {
							if (base.href.startsWith("/")) base.href = url.origin + base.href;
							else base.href = top.acode.joinUrl(url.origin + "/", top.acode.joinUrl(url.pathname, ".."), base.href);
						};
						if (! base.href.endsWith("/")) base.href += "/";
					} else {
						// 0. Pick up ingredients:
						base = document.createElement("base");
						// 1. Getting ready:
						base.href = url.origin + "/"; // Nasty trailing character, for broken rules.
						// 2. Get started:
						DOMContent.head.prepend(base);
					};

					// Make absolute links working:
					DOMContent.querySelectorAll("link, script, img, video, audio").forEach(props => {
						if (props instanceof HTMLLinkElement && ! props.href.startsWith("//") && props.href.startsWith("/")) props.href = url.origin + props.href;
						else if ((props instanceof HTMLScriptElement || props instanceof HTMLImageElement || props instanceof HTMLVideoElement || props instanceof HTMLAudioElement) && ! props.src.startsWith("//") && props.src.startsWith("/")) props.src = url.origin + props.src;
					});

					// Wohoo!
					document.write(DOMContent.documentElement.outerHTML);
				} else {
					// I stop now, can't work for free anymore on it:
					const fname = await top.acode.prompt("Put a file name before opening:", "Untitled");

					// Todo: We'll add syntax highlights by using, "PrismJS" project, in future.
					// Hey, it's not even beginning, the idea can be significantly upgraded!
					if (fname) top.acode.newEditorFile(fname, {
						"isUnsaved": true,
						"text": data,
						"editable": true,
						"deletedFile": false
					});
					else throw new Error("User cancelled action to view raw text contents.");
				} else throw new Error("Received data is binary, can't be opened for now.");
			}).catch(error => {
				// Capture reporter under our target.
				top.document.indexRoot = document.body;
				// Assign default settings to it.
				top.document.getElementByOrderedIndex(0, 4).value = error.message;
				top.document.getElementByOrderedIndex(0).classList.value = "";
				// Leave that for future use.
				top.document.indexRoot = null;
			});
		</script>
	</body>
</html>
